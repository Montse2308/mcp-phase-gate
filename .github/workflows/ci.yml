name: CI

# En cada PR, y en master al mergear. No se corre en cada push a una rama suelta a propósito:
# el flujo de este repo siempre pasa por un PR, así que un push a una rama sin PR abierto se
# revisaría dos veces al abrirlo y ninguna antes.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows además de Linux: la Documentación viaja entre los dos, y lo que solo falla en
        # Windows (junctions, nombres cortos 8.3, finales de línea, nombres reservados) no lo
        # ve una CI que corre solo en Linux.
        os: [ubuntu-latest, windows-latest]
        # 22 es la versión mínima soportada: los tests usan los patrones glob de `node --test`,
        # que no existen antes. 24 es la que traen los equipos nuevos.
        node-version: [22, 24]
        # macOS entra con la versión mínima soportada: es lo que se probará en los equipos de
        # Apple, sin duplicar las rondas de Node que ya cubren Linux y Windows.
        include:
          - os: macos-latest
            node-version: 22

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # El build va aparte del test para que un fallo de compilación del servidor se distinga
      # de un test en rojo: son dos problemas distintos y el log lo tiene que decir solo.
      - run: npm run build

      - run: npm test

  # Los E2E del Studio en Chromium (§7.10): cada vista, la demo y el sitio estático, con axe y en un
  # teléfono. Aparte de build-and-test porque necesitan el navegador. En los tres sistemas: hay fallos de
  # maquetación que dependen de las rutas del equipo, y las de Windows son otras. Node 22, la última 22.x
  # (Vite 8 pide al menos la 22.12 para compilar).
  e2e-studio:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # Chromium dentro de node_modules, como en local.
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # --with-deps instala las bibliotecas del sistema que Chromium necesita en Linux; en Windows y macOS no hace nada.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  # La fecha de un commit la escribe git de una manera que cambia entre versiones, y de eso depende el
  # atributo dateTime de la Bitácora y los bytes del sitio exportado. En ubuntu:24.04 (git 2.43) se
  # reproduce el formato antiguo, que los sistemas con un git más reciente ya no enseñan: así un cambio
  # de formato no se cuela por probar solo en máquinas modernas.
  git-2-43:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      # La imagen base no trae git: sin él, checkout bajaría un tarball sin .git y la suite no
      # tendría repositorio que probar.
      - run: apt-get update && apt-get install -y git ca-certificates

      - run: git --version && id -u

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test
