name: Studio en GitHub Pages

# El sitio: la portada en la raíz (en inglés) y en es/, la demo del Studio exportada como sitio estático en demo/,
# y los medios (capturas, GIF, video y póster) en medios/, en https://montse2308.github.io/mcp-phase-gate/.
# Se publica con cada tag de versión sin guion (una beta nunca publica), y se puede volver a correr a mano con el
# tag como ref. Una corrida manual sobre una rama solo construye, y deja el sitio entero en el artefacto
# sitio-completo, que se guarda 14 días: lo que se revisa es lo que se publica.
#
# El export nunca lee datos reales aquí: no hay PHASE_GATE_DOCS_PATH ni se pasa --incluir-datos-reales,
# así que `ui --export-static` genera la demo en una carpeta temporal.
#
# Requiere, una sola vez, activar Pages con origen "GitHub Actions" en la configuración del repo.
#
# Cinco jobs:
#   - sitio: compila, exporta la demo y arma la portada. Solo puede leer el repo.
#   - capturas: las tres capturas de la portada, de un `ui --demo` en vivo (Ajustes no sale de solo lectura), en
#     tema claro y en los dos idiomas, y la imagen de 1200×630 de la vista previa del link (social-preview-en.png y
#     social-preview-es.png). Sin ellas la portada no está completa, y por eso bloquean el sitio. A diferencia de los
#     medios, no están en la lista de respaldo de ensamblar: nunca faltan, y un respaldo la pisaría o la borraría.
#   - medios: el GIF, el video y el póster de cada idioma. Instala VHS, ffmpeg y Chromium, así que tampoco
#     tiene más permiso que leer. Si falla, el sitio sale igual, con los medios que ya había.
#   - ensamblar: sin permisos, junta todo en el artefacto sitio-completo.
#   - desplegar: el único con permiso para escribir en Pages. Publica exactamente ese artefacto, sin compilar ni
#     instalar nada.
# Las actions van fijadas por SHA, con su versión al lado: Dependabot las actualiza juntas.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Las construcciones van por ref: una corrida manual sobre una rama no cancela la de un tag. Y la de un tag no se
# cancela nunca, ni siquiera por otra corrida sobre el mismo tag: cancelar a mitad del despliegue dejaría el sitio
# a medias. El despliegue tiene además su propio grupo, para que dos tags publiquen uno detrás de otro.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: mkdir studio-public

      # La demo va a demo/, y la portada, a la raíz.
      - run: node build/index.js ui --export-static studio-public/demo

      - run: node scripts/portada.mjs --salida studio-public

      # «Instalar» es uno de los dos botones de la portada y lleva a estas dos guías: si no existen, el sitio no
      # se publica con un botón roto. Solo al publicar: mientras la v4 se construye, las guías pueden no estar.
      - name: Las guías a las que lleva «Instalar» existen
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          for guia in docs/guide/installation.md docs/guia/instalacion.md; do
            test -f "$guia" || { echo "::error::Falta $guia, y «Instalar» de la portada apunta ahí."; exit 1; }
          done

      # Con include-hidden-files: el .nojekyll empieza por punto.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio
          path: studio-public
          include-hidden-files: true
          retention-days: 1

  capturas:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: node scripts/capturas-studio.mjs --portada --salida capturas

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas
          path: capturas
          retention-days: 1

  # Los medios de los README: el GIF corto, el video completo y el póster de cada idioma, generados aquí desde la
  # demo real con VHS (terminal) y Playwright (Studio), y publicados en el sitio, en medios/. No se versionan en
  # git. scripts/medios.mjs falla si el GIF pasa de 2.5 MB o el MP4 de 8 MB.
  medios:
    needs: [sitio, capturas]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # La escena 7 graba el sitio en un teléfono: la portada, con sus capturas, y la demo.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
          path: studio-public

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capturas
          path: studio-public/medios

      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
          install-fonts: "true"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-jetbrains-mono

      - run: npx playwright install --with-deps chromium

      - run: node scripts/medios.mjs --sitio studio-public --salida medios

      # Lo que pesa cada pieza queda a la vista en el log.
      - run: |
          ls -l medios
          cat medios/medios.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medios
          path: medios
          retention-days: 1

  ensamblar:
    needs: [sitio, capturas, medios]
    # También si los medios fallaron: la portada y la demo no dependen de ellos. Las capturas sí.
    if: ${{ !cancelled() && needs.sitio.result == 'success' && needs.capturas.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
          path: sitio-completo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capturas
          path: sitio-completo/medios

      - id: medios
        if: ${{ needs.medios.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: medios
          path: sitio-completo/medios

      # Sin medios nuevos, los que ya están publicados: desplegar reemplaza el sitio entero, y sin ellos los
      # README (en GitHub y en npmjs.com) enseñarían imágenes rotas. Si tampoco hay publicados (la primera
      # vez), el sitio sale sin medios y se avisa.
      - if: ${{ steps.medios.outcome != 'success' }}
        env:
          SITIO: https://montse2308.github.io/mcp-phase-gate/medios
        run: |
          echo "::warning::Los medios no se generaron: el sitio sale con los que ya estaban publicados."
          for archivo in demo-es.gif demo-en.gif demo-es.mp4 demo-en.mp4 poster-es.png poster-en.png medios.json; do
            if ! curl -fsSL --retry 2 -o "sitio-completo/medios/$archivo" "$SITIO/$archivo"; then
              rm -f "sitio-completo/medios/$archivo"
              echo "::warning::$archivo no estaba publicado: el sitio sale sin él."
            fi
          done

      - name: El sitio trae todo lo que tiene que traer
        run: |
          for ruta in index.html es/index.html demo/index.html medios medios/social-preview-en.png medios/social-preview-es.png .nojekyll; do
            test -e "sitio-completo/$ruta" || { echo "::error::Falta $ruta en el sitio."; exit 1; }
          done
          find sitio-completo -type f | sort

      # El mismo tope que vigila studio/e2e/portada.spec.ts, pero sobre lo que de verdad se publica: las capturas
      # se regeneran en cada corrida y cambian de peso, así que el e2e solo mide las suyas.
      - name: La primera carga de la portada no pasa de 300 kB
        working-directory: sitio-completo
        run: |
          comunes="portada.css tema-claro.css portada.js demo/fuentes/inter-latin-wght-normal.woff2 demo/fuentes/jetbrains-mono-latin-wght-normal.woff2"
          falla=0
          for idioma in en es; do
            if [ "$idioma" = es ]; then pagina=es/index.html; else pagina=index.html; fi
            total=0
            for archivo in $pagina $comunes medios/captura-red-$idioma.* medios/captura-tablero-$idioma.* medios/captura-ajustes-$idioma.*; do
              test -f "$archivo" || { echo "::error::Falta $archivo: la portada en $idioma no está completa."; exit 1; }
              total=$((total + $(wc -c < "$archivo")))
            done
            echo "primera carga ($idioma): $total bytes"
            [ "$total" -le 300000 ] || { echo "::error::La portada en $idioma pesa $total bytes en su primera carga: pasa de 300000."; falla=1; }
          done
          exit $falla

      # El artefacto del sitio entero: con include-hidden-files, porque el .nojekyll empieza por punto.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio-completo
          path: sitio-completo
          include-hidden-files: true
          retention-days: 14

  desplegar:
    needs: ensamblar
    # Solo un tag de versión sin guion: una beta nunca publica. Una corrida manual sobre una rama solo construye.
    # La forma exacta del tag la comprueba el primer paso del job.
    if: ${{ !cancelled() && needs.ensamblar.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-desplegar
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # El `if` del job deja pasar cualquier tag que empiece por v y no lleve guion (vnext, v4.0.0.rc1). Aquí se
      # exige la forma de una versión: si no la tiene, no se publica y se dice por qué.
      - name: El tag es una versión
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::El tag $TAG no es una versión (vMAYOR.MENOR.PARCHE): no se publica."
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio-completo
          path: sitio-completo

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Desde la v4, upload-pages-artifact deja fuera los archivos que empiezan por punto: sin
      # include-hidden-files, el .nojekyll no llegaría.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sitio-completo
          include-hidden-files: true

      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
