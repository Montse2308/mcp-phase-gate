name: Studio en GitHub Pages

# La demo del Studio, exportada como sitio estático (§7.9 del plan), en
# https://montse2308.github.io/mcp-phase-gate/. Se publica con cada tag de versión, o a mano.
#
# El export nunca lee datos reales aquí: no hay PHASE_GATE_DOCS_PATH ni se pasa --incluir-datos-reales,
# así que `ui --export-static` genera la demo en una carpeta temporal (R6).
#
# Requiere, una sola vez, activar Pages con origen "GitHub Actions" en la configuración del repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node build/index.js ui --export-static studio-public

      # Los medios de los README (§8.8): el GIF, el video y el póster de cada idioma, generados aquí desde la
      # demo real con VHS (terminal) y Playwright (Studio), y publicados en el sitio, en medios/. No se
      # versionan en git. scripts/medios.mjs falla si el GIF pasa de 5 MB o el MP4 de 8 MB.
      - uses: charmbracelet/vhs-action@v2.1.1
        with:
          version: v0.12.1
          install-fonts: "true"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-ibm-plex

      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - run: node scripts/medios.mjs --sitio studio-public --salida studio-public/medios
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - uses: actions/configure-pages@v6

      # Desde la v4, upload-pages-artifact deja fuera los archivos que empiezan por punto: sin
      # include-hidden-files, el .nojekyll del export no llegaría.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: studio-public
          include-hidden-files: true

      - id: despliegue
        uses: actions/deploy-pages@v5
