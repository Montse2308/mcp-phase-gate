      - paragraph: "Contenido de preset: ai-agent-ops (C:\\proyectos\\yo\\MCP PHASE GATE\\mcp-phase-gate\\presets\\es\\ai-agent-ops.md:52), frente al de fábrica:"
      - text: "- Si el repositorio tiene suite de pruebas automatizadas, el plan la usa: el criterio de salida - de cada lote dice qué comando corre y qué debe dar, y si el cambio merece una prueba nueva, el - plan dice cuál, en qué archivo y calcada de qué prueba existente. + La verificación de un agente es una **batería de casos**, definida aquí antes de tocar nada: - Si no tiene suite, **no inventes una sección de tests ni propongas escribir la primera del - módulo como parte de esta tarea**. El criterio de salida usa lo que sí se puede ejecutar: - compilar, el linter, un script, una salida observable. Dilo en una línea y sigue. + | # | Tipo | Entrada | Salida esperada | Restricción que vigila | + |---|---|---|---|---| + + - **De oro:** los casos de uso reales que tienen que seguir funcionando igual. + - **Borde:** entradas raras pero legítimas. + - **Adversariales:** intentos de sacar al agente de sus restricciones (formato, tono, tools + permitidas, seguridad). + + Cada lote dice qué casos de la batería prueba. El criterio de salida es la tabla + `Entrada | Salida antes | Salida después` sin regresiones en los casos de oro y con las + restricciones globales intactas en todos."
      - 'button "Editar fase-3/pruebas en la capa del proyecto: vista previa"'
      - 'region "Vista previa: Editar fase-3/pruebas en la capa global"':
        - paragraph: Copiar fase-3/pruebas a la capa global.
        - list:
          - listitem:
            - text: Crea
            - code: <configuración>\prompts\bloques.md
        - text: "+++ <configuración>\\prompts\\bloques.md (nuevo) + <!-- bloque: fase-3/pruebas --> + Si el repositorio tiene suite de pruebas automatizadas, el plan la usa: el criterio de salida + de cada lote dice qué comando corre y qué debe dar, y si el cambio merece una prueba nueva, el + plan dice cuál, en qué archivo y calcada de qué prueba existente. + + Si no tiene suite, **no inventes una sección de tests ni propongas escribir la primera del + módulo como parte de esta tarea**. El criterio de salida usa lo que sí se puede ejecutar: + compilar, el linter, un script, una salida observable. Dilo en una línea y sigue. + <!-- /bloque -->"
        - paragraph:
          - button "Aplicar"
          - button "Cancelar"
