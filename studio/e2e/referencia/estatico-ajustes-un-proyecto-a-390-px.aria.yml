- link "Saltar al contenido":
  - /url: "#contenido"
- note:
  - text: "Demo: datos de ejemplo. Todo es de solo lectura."
  - link "Qué es mcp-phase-gate":
    - /url: https://montse2308.github.io/mcp-phase-gate/es/
- banner:
  - paragraph: mcp-phase-gate Studio
  - navigation "Vistas":
    - list:
      - listitem:
        - link "Red":
          - /url: "#/red"
      - listitem:
        - link "Tablero":
          - /url: "#/tablero"
      - listitem:
        - link "Taller":
          - /url: "#/taller"
      - listitem:
        - link "Vigía":
          - /url: "#/vigia"
      - listitem:
        - link "Bitácora":
          - /url: "#/bitacora"
      - listitem:
        - link "Ajustes":
          - /url: "#/ajustes"
  - button "Tema oscuro"
  - group "Idioma":
    - button "ES" [pressed]
    - button "EN"
- main:
  - region "Ajustes":
    - heading "Ajustes" [level=1]
    - navigation "Páginas de Ajustes":
      - text: Ir a la página
      - combobox "Ir a la página":
        - option "Este equipo"
        - option "ASISTENTE"
        - option "INVESTIGACION"
        - option "TIENDA" [selected]
        - option "Clientes MCP"
        - option "Studio"
        - option "Avanzado"
    - heading "Proyecto TIENDA" [level=2]
    - paragraph: Lo que se guarda en el phase-gate.json de este proyecto, que viaja con la Documentación, y la ruta propia de sus repos en esta computadora, que va en machine.json.
    - text: Preset
    - combobox "Preset" [disabled]:
      - option "(sin elegir)"
      - option "ai-agent-ops"
      - option "multi-repo-feature" [selected]
      - option "research-ops"
      - option "software"
      - option "software-replica"
      - option "software-tdd"
    - paragraph: Ahora se usa multi-repo-feature, del proyecto.
    - text: Idioma del proyecto
    - combobox "Idioma del proyecto" [disabled]:
      - option "(sin elegir)" [selected]
      - option "Español"
      - option "English"
    - text: Lotes
    - combobox "Lotes" [disabled]:
      - 'option "(lo decide el preset: sí)" [selected]'
      - option "Con lotes"
      - option "Sin lotes"
    - text: Política de commits
    - combobox "Política de commits" [disabled]:
      - 'option "(lo decide el preset: agente-commitea-con-OK)" [selected]'
      - option "agente-commitea-con-OK"
      - option "agente-propone"
      - option "auto"
      - option "ninguno"
    - text: Comandos de verificación (uno por línea)
    - textbox "Comandos de verificación (uno por línea)" [disabled]: npm test
    - text: Un PR por repo
    - combobox "Un PR por repo" [disabled]:
      - option "(sin elegir)"
      - option "Un PR por cada repo" [selected]
      - option "Un solo PR"
    - group "Repos del proyecto":
      - text: Repos del proyecto
      - table "Repos del proyecto":
        - caption: Repos del proyecto
        - rowgroup:
          - row "Id Carpeta Rol En esta computadora Acciones":
            - columnheader "Id"
            - columnheader "Carpeta"
            - columnheader "Rol"
            - columnheader "En esta computadora"
            - columnheader "Acciones"
        - rowgroup:
          - 'row "api Carpeta: tienda-api Rol: backend En esta computadora: Acciones: Quitar api"':
            - rowheader "api":
              - code: api
            - 'cell "Carpeta: tienda-api"':
              - text: "Carpeta:"
              - textbox "Carpeta de api" [disabled]: tienda-api
            - 'cell "Rol: backend"':
              - text: "Rol:"
              - textbox "Rol de api" [disabled]: backend
            - cell "En esta computadora:":
              - text: "En esta computadora:"
              - textbox "Ruta propia de api en esta computadora" [disabled]
            - 'cell "Acciones: Quitar api"':
              - text: "Acciones:"
              - button "Quitar api" [disabled]
          - 'row "web Carpeta: tienda-web Rol: frontend En esta computadora: Acciones: Quitar web"':
            - rowheader "web":
              - code: web
            - 'cell "Carpeta: tienda-web"':
              - text: "Carpeta:"
              - textbox "Carpeta de web" [disabled]: tienda-web
            - 'cell "Rol: frontend"':
              - text: "Rol:"
              - textbox "Rol de web" [disabled]: frontend
            - cell "En esta computadora:":
              - text: "En esta computadora:"
              - textbox "Ruta propia de web en esta computadora" [disabled]
            - 'cell "Acciones: Quitar web"':
              - text: "Acciones:"
              - button "Quitar web" [disabled]
    - paragraph:
      - button "Guardar los cambios" [disabled]
      - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
