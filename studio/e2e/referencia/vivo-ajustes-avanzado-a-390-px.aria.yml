            - text: Dónde se guardan los punteros de tarea activa y las sesiones. Cada registro del servidor con su propia Documentación necesita la suya.
          - 'cell "Nombre usado: PHASE_GATE_STATE_PATH"'
          - 'cell "Valor: <raiz>/estado"'
          - 'cell "De dónde sale: entorno"'
          - 'cell "Cómo cambiarla: No se edita desde Ajustes. Se cambia en el bloque \"env\" del mcp.json de tu cliente (o en el entorno de quien lanza el servidor): PHASE_GATE_STATE_PATH."'
        - 'row "PHASE_GATE_CONFIG_PATH La carpeta de configuración de este equipo: machine.json, los presets propios y la capa global de prompts. Nombre usado: PHASE_GATE_CONFIG_PATH Valor: <raiz>/config De dónde sale: entorno Cómo cambiarla: No se edita desde Ajustes. Se cambia en el bloque \"env\" del mcp.json de tu cliente (o en el entorno de quien lanza el servidor): PHASE_GATE_CONFIG_PATH."':
