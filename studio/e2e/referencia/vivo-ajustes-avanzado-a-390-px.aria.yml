        - 'row "PHASE_GATE_STATE_PATH Dónde se guardan los punteros de tarea activa y las sesiones. Cada registro del servidor con su propia Documentación necesita la suya. Nombre usado: PHASE_GATE_STATE_PATH Valor: <raiz>/estado De dónde sale: entorno Cómo cambiarla: No se edita desde Ajustes. Se cambia en el bloque \"env\" del mcp.json de tu cliente (o en el entorno de quien lanza el servidor): PHASE_GATE_STATE_PATH."':
