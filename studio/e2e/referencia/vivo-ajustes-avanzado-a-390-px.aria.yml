            - text: «off» para que el servidor no pida confirmaciones al cliente y las pida en el chat.
          - 'cell "Nombre usado: —"'
          - 'cell "Valor: sin definir"'
          - 'cell "De dónde sale: sin definir"'
          - 'cell "Cómo cambiarla: No se edita desde Ajustes. Se cambia en el bloque \"env\" del mcp.json de tu cliente (o en el entorno de quien lanza el servidor): PHASE_GATE_ELICITATION."'
        - 'row "PHASE_GATE_LANG El idioma del servidor: el de sus mensajes y el de los proyectos sin idioma propio. Gana al idioma por defecto de este equipo. Nombre usado: PHASE_GATE_LANG Valor: es De dónde sale: entorno Cómo cambiarla: No se edita desde Ajustes. Se cambia en el bloque \"env\" del mcp.json de tu cliente (o en el entorno de quien lanza el servidor): PHASE_GATE_LANG."':
