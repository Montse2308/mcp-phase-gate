      - caption: Variables avanzadas
      - rowgroup:
        - row "Variable Nombre usado Valor De dónde sale Cómo cambiarla":
          - columnheader "Variable"
          - columnheader "Nombre usado"
          - columnheader "Valor"
          - columnheader "De dónde sale"
          - columnheader "Cómo cambiarla"
      - rowgroup:
