- link "Saltar al contenido":
  - /url: "#contenido"
- note: "Demo: datos de ejemplo. Todo es de solo lectura."
- banner:
  - paragraph: mcp-phase-gate Studio
  - navigation "Vistas":
    - list:
      - listitem:
        - link "Red":
          - /url: "#/red"
      - listitem:
        - link "Tablero":
          - /url: "#/tablero"
      - listitem:
        - link "Taller":
          - /url: "#/taller"
      - listitem:
        - link "Vigía":
          - /url: "#/vigia"
      - listitem:
        - link "Bitácora":
          - /url: "#/bitacora"
  - button "Tema oscuro"
  - group "Idioma":
    - button "ES" [pressed]
    - button "EN"
- main:
  - region "Vigía":
    - heading "Vigía" [level=1]
    - paragraph: "mcp-phase-gate <versión> · Node <versión> · Vigilancia apagada: sin vigilancia, recarga a mano"
    - region "Diagnóstico":
      - heading "Diagnóstico" [level=2]
      - paragraph: "Sin hallazgos: todo en orden."
    - region "Clientes MCP":
      - heading "Clientes MCP" [level=2]
      - paragraph: "Lo que haría `mcp-phase-gate init` en cada uno. Nada se escribe sin la vista previa y su \"Aplicar\"."
      - article "Claude Code":
        - heading "Claude Code" [level=3]
        - paragraph: no detectado
        - paragraph: "No se puede saber si ya está registrado: no se pudo ejecutar claude mcp list (en la demo no se ejecuta `claude`)."
        - paragraph:
          - checkbox "Copiar también los comandos de fase (/f1…/fN)"
          - text: Copiar también los comandos de fase (/f1…/fN)
        - paragraph:
          - button "Configurar Claude Code" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
      - article "Cursor":
        - heading "Cursor" [level=3]
        - paragraph: no detectado
        - paragraph: Se registraría como «pg».
        - paragraph:
          - text: "Archivo:"
          - code: ~/.cursor/mcp.json
        - text: <diff>
        - paragraph:
          - checkbox "Copiar también los comandos de fase (/f1…/fN)"
          - text: Copiar también los comandos de fase (/f1…/fN)
        - paragraph:
          - button "Configurar Cursor" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
      - article "VS Code":
        - heading "VS Code" [level=3]
        - paragraph: no detectado
        - paragraph: Se registraría como «pg».
        - paragraph:
          - text: "Archivo:"
          - code: ~/<carpeta de VS Code>/mcp.json
        - text: <diff>
        - paragraph:
          - button "Configurar VS Code" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
    - region "Variables":
      - heading "Variables" [level=2]
      - table "Variables de entorno":
        - caption: Variables de entorno
        - rowgroup:
          - row "Variable Nombre usado Valor De dónde sale Discrepancia":
            - columnheader "Variable"
            - columnheader "Nombre usado"
            - columnheader "Valor"
            - columnheader "De dónde sale"
            - columnheader "Discrepancia"
        - rowgroup:
          - 'row "DOCS_PATH Nombre usado: PHASE_GATE_DOCS_PATH Valor: <Documentación> De dónde sale: entorno Discrepancia: —"':
            - rowheader "DOCS_PATH"
            - 'cell "Nombre usado: PHASE_GATE_DOCS_PATH"'
            - 'cell "Valor: <Documentación>"'
            - 'cell "De dónde sale: entorno"'
            - 'cell "Discrepancia: —"'
          - 'row "REPOS_PATH Nombre usado: PHASE_GATE_REPOS_PATH Valor: <repos> De dónde sale: entorno Discrepancia: —"':
            - rowheader "REPOS_PATH"
            - 'cell "Nombre usado: PHASE_GATE_REPOS_PATH"'
            - 'cell "Valor: <repos>"'
            - 'cell "De dónde sale: entorno"'
            - 'cell "Discrepancia: —"'
          - 'row "TASKS_SUBDIR Nombre usado: PHASE_GATE_TASKS_SUBDIR Valor: Proyectos De dónde sale: entorno Discrepancia: —"':
            - rowheader "TASKS_SUBDIR"
            - 'cell "Nombre usado: PHASE_GATE_TASKS_SUBDIR"'
            - 'cell "Valor: Proyectos"'
            - 'cell "De dónde sale: entorno"'
            - 'cell "Discrepancia: —"'
          - 'row "PROMPTS_PATH Nombre usado: — Valor: — De dónde sale: sin definir Discrepancia: —"':
            - rowheader "PROMPTS_PATH"
            - 'cell "Nombre usado: —"'
            - 'cell "Valor: —"'
            - 'cell "De dónde sale: sin definir"'
            - 'cell "Discrepancia: —"'
          - 'row "STATE_PATH Nombre usado: PHASE_GATE_STATE_PATH Valor: <estado> De dónde sale: entorno Discrepancia: —"':
            - rowheader "STATE_PATH"
            - 'cell "Nombre usado: PHASE_GATE_STATE_PATH"'
            - 'cell "Valor: <estado>"'
            - 'cell "De dónde sale: entorno"'
            - 'cell "Discrepancia: —"'
          - 'row "CONFIG_PATH Nombre usado: PHASE_GATE_CONFIG_PATH Valor: <configuración> De dónde sale: entorno Discrepancia: —"':
            - rowheader "CONFIG_PATH"
            - 'cell "Nombre usado: PHASE_GATE_CONFIG_PATH"'
            - 'cell "Valor: <configuración>"'
            - 'cell "De dónde sale: entorno"'
            - 'cell "Discrepancia: —"'
          - 'row "ELICITATION Nombre usado: — Valor: — De dónde sale: sin definir Discrepancia: —"':
            - rowheader "ELICITATION"
            - 'cell "Nombre usado: —"'
            - 'cell "Valor: —"'
            - 'cell "De dónde sale: sin definir"'
            - 'cell "Discrepancia: —"'
          - 'row "LANG Nombre usado: — Valor: — De dónde sale: sin definir Discrepancia: —"':
            - rowheader "LANG"
            - 'cell "Nombre usado: —"'
            - 'cell "Valor: —"'
            - 'cell "De dónde sale: sin definir"'
            - 'cell "Discrepancia: —"'
