- link "Saltar al contenido":
  - /url: "#contenido"
- note: "Demo: datos de ejemplo. Todo es de solo lectura."
- banner:
  - paragraph: mcp-phase-gate Studio
  - navigation "Vistas":
    - list:
      - listitem:
        - link "Red":
          - /url: "#/red"
      - listitem:
        - link "Tablero":
          - /url: "#/tablero"
      - listitem:
        - link "Taller":
          - /url: "#/taller"
      - listitem:
        - link "Vigía":
          - /url: "#/vigia"
      - listitem:
        - link "Bitácora":
          - /url: "#/bitacora"
  - button "Tema oscuro"
  - group "Idioma":
    - button "ES" [pressed]
    - button "EN"
- main:
  - region "Vigía":
    - heading "Vigía" [level=1]
    - paragraph: "mcp-phase-gate <versión> · Node <versión> · Vigilancia apagada: sin vigilancia, recarga a mano"
    - region "Diagnóstico":
      - heading "Diagnóstico" [level=2]
      - paragraph: "Sin hallazgos: todo en orden."
    - region "Clientes MCP":
      - heading "Clientes MCP" [level=2]
      - paragraph: "Lo que haría `mcp-phase-gate init` en cada uno. Nada se escribe sin la vista previa y su \"Aplicar\"."
      - article "Claude Code":
        - heading "Claude Code" [level=3]
        - paragraph: no detectado
        - paragraph: "No se puede saber si ya está registrado: no se pudo ejecutar claude mcp list (en la demo no se ejecuta `claude`)."
        - paragraph:
          - checkbox "Copiar también los comandos de fase (/f1…/fN)"
          - text: Copiar también los comandos de fase (/f1…/fN)
        - paragraph:
          - button "Configurar Claude Code" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
      - article "Cursor":
        - heading "Cursor" [level=3]
        - paragraph: no detectado
        - paragraph: Se registraría como «pg».
        - paragraph:
          - text: "Archivo:"
          - code: ~/.cursor/mcp.json
        - text: "+ { + \"command\": \"npx\", + \"args\": [ + \"-y\", + \"mcp-phase-gate\" + ], + \"env\": { + \"PHASE_GATE_DOCS_PATH\": \"<Documentación>\", + \"PHASE_GATE_REPOS_PATH\": \"<repos>\", + \"PHASE_GATE_ELICITATION\": \"off\" + } + }"
        - paragraph:
          - checkbox "Copiar también los comandos de fase (/f1…/fN)"
          - text: Copiar también los comandos de fase (/f1…/fN)
        - paragraph:
          - button "Configurar Cursor" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
      - article "VS Code":
        - heading "VS Code" [level=3]
        - paragraph: no detectado
        - paragraph: Se registraría como «pg».
        - paragraph:
          - text: "Archivo:"
          - code: ~/<carpeta de VS Code>/mcp.json
        - text: "+ { + \"type\": \"stdio\", + \"command\": \"npx\", + \"args\": [ + \"-y\", + \"mcp-phase-gate\" + ], + \"env\": { + \"PHASE_GATE_DOCS_PATH\": \"<Documentación>\", + \"PHASE_GATE_REPOS_PATH\": \"<repos>\" + } + }"
        - paragraph:
          - button "Configurar VS Code" [disabled]
          - text: En la demo publicada todo es de solo lectura. Pruébalo en tu equipo con npx mcp-phase-gate ui --demo.
    - region "Variables":
      - heading "Variables" [level=2]
      - table "Variables de entorno":
        - caption: Variables de entorno
        - rowgroup:
          - row "Variable Nombre usado Valor De dónde sale Discrepancia":
            - columnheader "Variable"
            - columnheader "Nombre usado"
            - columnheader "Valor"
            - columnheader "De dónde sale"
            - columnheader "Discrepancia"
        - rowgroup:
          - row "DOCS_PATH PHASE_GATE_DOCS_PATH <Documentación> entorno —":
            - rowheader "DOCS_PATH"
            - cell "PHASE_GATE_DOCS_PATH"
            - cell "<Documentación>"
            - cell "entorno"
            - cell "—"
          - row "REPOS_PATH PHASE_GATE_REPOS_PATH <repos> entorno —":
            - rowheader "REPOS_PATH"
            - cell "PHASE_GATE_REPOS_PATH"
            - cell "<repos>"
            - cell "entorno"
            - cell "—"
          - row "TASKS_SUBDIR PHASE_GATE_TASKS_SUBDIR Proyectos entorno —":
            - rowheader "TASKS_SUBDIR"
            - cell "PHASE_GATE_TASKS_SUBDIR"
            - cell "Proyectos"
            - cell "entorno"
            - cell "—"
          - row "PROMPTS_PATH — — sin definir —":
            - rowheader "PROMPTS_PATH"
            - cell "—"
            - cell "—"
            - cell "sin definir"
            - cell "—"
          - row "STATE_PATH PHASE_GATE_STATE_PATH <estado> entorno —":
            - rowheader "STATE_PATH"
            - cell "PHASE_GATE_STATE_PATH"
            - cell "<estado>"
            - cell "entorno"
            - cell "—"
          - row "CONFIG_PATH PHASE_GATE_CONFIG_PATH <configuración> entorno —":
            - rowheader "CONFIG_PATH"
            - cell "PHASE_GATE_CONFIG_PATH"
            - cell "<configuración>"
            - cell "entorno"
            - cell "—"
          - row "ELICITATION — — sin definir —":
            - rowheader "ELICITATION"
            - cell "—"
            - cell "—"
            - cell "sin definir"
            - cell "—"
          - row "LANG — — sin definir —":
            - rowheader "LANG"
            - cell "—"
            - cell "—"
            - cell "sin definir"
            - cell "—"
