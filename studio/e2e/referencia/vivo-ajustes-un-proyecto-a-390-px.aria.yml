- link "Saltar al contenido":
  - /url: "#contenido"
- banner:
  - paragraph: mcp-phase-gate Studio
  - navigation "Vistas":
    - list:
      - listitem:
        - link "Red":
          - /url: "#/red"
      - listitem:
        - link "Tablero":
          - /url: "#/tablero"
      - listitem:
        - link "Taller":
          - /url: "#/taller"
      - listitem:
        - link "Vigía":
          - /url: "#/vigia"
      - listitem:
        - link "Bitácora":
          - /url: "#/bitacora"
      - listitem:
        - link "Ajustes":
          - /url: "#/ajustes"
  - button "Tema oscuro"
  - group "Idioma":
    - button "ES" [pressed]
    - button "EN"
- main:
  - region "Ajustes":
    - heading "Ajustes" [level=1]
    - navigation "Páginas de Ajustes":
      - text: Ir a la página
      - combobox "Ir a la página":
        - option "Este equipo"
        - option "INVESTIGACION"
        - option "NUEVO"
        - option "ROTO"
        - option "TALLER"
        - option "TIENDA" [selected]
        - option "Clientes MCP"
        - option "Studio"
        - option "Avanzado"
    - heading "Proyecto TIENDA" [level=2]
    - paragraph: Lo que se guarda en el phase-gate.json de este proyecto, que viaja con la Documentación, y la ruta propia de sus repos en esta computadora, que va en machine.json.
    - text: Preset
    - combobox "Preset":
      - option "(sin elegir)"
      - option "ai-agent-ops"
      - option "multi-repo-feature" [selected]
      - option "research-ops"
      - option "software"
      - option "software-replica"
      - option "software-tdd"
    - paragraph: Ahora se usa multi-repo-feature, del proyecto.
    - text: Idioma del proyecto
    - combobox "Idioma del proyecto":
      - option "(sin elegir)" [selected]
      - option "Español"
      - option "English"
    - text: Lotes
    - combobox "Lotes":
      - 'option "(lo decide el preset: sí)" [selected]'
      - option "Con lotes"
      - option "Sin lotes"
    - text: Política de commits
    - combobox "Política de commits":
      - 'option "(lo decide el preset: agente-commitea-con-OK)" [selected]'
      - option "agente-commitea-con-OK"
      - option "agente-propone"
      - option "auto"
      - option "ninguno"
    - text: Comandos de verificación (uno por línea)
    - textbox "Comandos de verificación (uno por línea)"
    - text: Un PR por repo
    - combobox "Un PR por repo":
      - option "(sin elegir)" [selected]
      - option "Un PR por cada repo"
      - option "Un solo PR"
    - group "Repos del proyecto":
      - text: Repos del proyecto
      - table "Repos del proyecto":
        - caption: Repos del proyecto
        - rowgroup:
          - row "Id Carpeta Rol En esta computadora Acciones":
            - columnheader "Id"
            - columnheader "Carpeta"
            - columnheader "Rol"
            - columnheader "En esta computadora"
            - columnheader "Acciones"
        - rowgroup:
          - 'row "api Carpeta: api Rol: backend En esta computadora: Acciones: Quitar api"':
            - rowheader "api":
              - code: api
            - 'cell "Carpeta: api"':
              - text: "Carpeta:"
              - textbox "Carpeta de api": api
            - 'cell "Rol: backend"':
              - text: "Rol:"
              - textbox "Rol de api": backend
            - cell "En esta computadora:":
              - text: "En esta computadora:"
              - textbox "Ruta propia de api en esta computadora"
            - 'cell "Acciones: Quitar api"':
              - text: "Acciones:"
              - button "Quitar api"
          - 'row "web Carpeta: web Rol: En esta computadora: Acciones: Quitar web"':
            - rowheader "web":
              - code: web
            - 'cell "Carpeta: web"':
              - text: "Carpeta:"
              - textbox "Carpeta de web": web
            - cell "Rol:":
              - text: "Rol:"
              - textbox "Rol de web"
            - cell "En esta computadora:":
              - text: "En esta computadora:"
              - textbox "Ruta propia de web en esta computadora"
            - 'cell "Acciones: Quitar web"':
              - text: "Acciones:"
              - button "Quitar web"
          - 'row "pagos Carpeta: pagos Rol: En esta computadora: Acciones: Quitar pagos"':
            - rowheader "pagos":
              - code: pagos
            - 'cell "Carpeta: pagos"':
              - text: "Carpeta:"
              - textbox "Carpeta de pagos": pagos
            - cell "Rol:":
              - text: "Rol:"
              - textbox "Rol de pagos"
            - cell "En esta computadora:":
              - text: "En esta computadora:"
              - textbox "Ruta propia de pagos en esta computadora"
            - 'cell "Acciones: Quitar pagos"':
              - text: "Acciones:"
              - button "Quitar pagos"
      - group "Agregar un repo":
        - text: Agregar un repo
        - paragraph:
          - text: Id del repo nuevo
          - textbox "Id del repo nuevo"
        - paragraph:
          - text: Carpeta del repo nuevo
          - textbox "Carpeta del repo nuevo"
        - paragraph:
          - text: Rol (opcional)
          - textbox "Rol (opcional)"
        - paragraph:
          - text: En esta computadora está en otra carpeta (opcional)
          - textbox "En esta computadora está en otra carpeta (opcional)"
        - button "Agregar a la lista"
    - 'button "Guardar los cambios: vista previa" [disabled]'
