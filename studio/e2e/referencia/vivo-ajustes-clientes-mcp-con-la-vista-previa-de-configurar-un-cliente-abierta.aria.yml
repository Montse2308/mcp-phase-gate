- main:
  - region "Ajustes":
    - heading "Ajustes" [level=1]
    - navigation "Páginas de Ajustes":
      - list:
        - listitem:
          - link "Este equipo":
            - /url: "#/ajustes/equipo"
        - listitem:
          - text: Proyectos
          - link "INVESTIGACION":
            - /url: "#/ajustes/proyecto/INVESTIGACION"
        - listitem:
          - link "NUEVO":
            - /url: "#/ajustes/proyecto/NUEVO"
        - listitem:
          - link "ROTO":
            - /url: "#/ajustes/proyecto/ROTO"
        - listitem:
          - link "TALLER":
            - /url: "#/ajustes/proyecto/TALLER"
        - listitem:
          - link "TIENDA":
            - /url: "#/ajustes/proyecto/TIENDA"
        - listitem:
          - link "Clientes MCP":
            - /url: "#/ajustes/clientes"
        - listitem:
          - link "Studio":
            - /url: "#/ajustes/studio"
        - listitem:
          - link "Avanzado":
            - /url: "#/ajustes/avanzado"
    - heading "Clientes MCP" [level=2]
    - paragraph: "Lo que haría `mcp-phase-gate init` en cada uno. Nada se escribe sin la vista previa y su \"Aplicar\"."
    - article "Claude Code":
      - heading "Claude Code" [level=3]
      - paragraph: detectado en este equipo
      - paragraph: Se registraría como «pg» (ámbito user).
      - paragraph:
        - text: "Comando:"
        - code: claude mcp add pg --scope user -- npx -y mcp-phase-gate
      - paragraph:
        - checkbox "Copiar también los comandos de fase (/f1…/fN)"
        - text: Copiar también los comandos de fase (/f1…/fN)
      - 'button "Configurar Claude Code: vista previa"'
    - article "Cursor":
      - heading "Cursor" [level=3]
      - paragraph: no detectado
      - paragraph: Se registraría como «pg».
      - paragraph:
        - text: "Archivo:"
        - code: ~/.cursor/mcp.json
      - text: <diff>
      - paragraph:
        - checkbox "Copiar también los comandos de fase (/f1…/fN)"
        - text: Copiar también los comandos de fase (/f1…/fN)
      - 'region "Vista previa: Configurar Cursor"':
        - paragraph: Las rutas pasan a machine.json (rutas.documentacion = "<raiz>/docs"; rutas.carpetaDeRepos = "<raiz>/repos"), para que el servidor de cada cliente y el Studio las lean de ahí. Registrar el servidor en Cursor como «pg».
        - list:
          - listitem:
            - text: Crea
            - code: <configuración>/machine.json
          - listitem:
            - text: Crea
            - code: ~/.cursor/mcp.json
        - text: <diff>
        - paragraph:
          - button "Aplicar"
          - button "Cancelar"
    - article "VS Code":
      - heading "VS Code" [level=3]
      - paragraph: no detectado
      - paragraph: Se registraría como «pg».
      - paragraph:
        - text: "Archivo:"
        - code: ~/<carpeta de VS Code>/mcp.json
      - text: <diff>
      - 'button "Configurar VS Code: vista previa"'
